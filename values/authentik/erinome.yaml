# Artifact Hub: https://artifacthub.io/packages/helm/goauthentik/authentik

# helm repo add goauthentik https://charts.goauthentik.io/
# helm install authentik goauthentik/authentik --values values.yaml -n erinome

global:
  namespaceOverride: erinome

authentik:
  postgresql:
    user: file:///authentik-database-secret/username
    password: file:///authentik-database-secret/password

server:
  ingress:
    annotations:
      app.kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: cert-manager-cluster-issuer
    enabled: true
    hosts:
      - authentik.caenen.net
    tls:
      - hosts:
          - authentik.caenen.net
        secretName: authentik-caenen-net-tls
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-server-secret
          key: key
  volumes:
    - name: authentik-database-secret
      secret:
        secretName: authentik-database-secret
  volumeMounts:
    - name: authentik-database-secret
      mountPath: /authentik-database-secret
      readOnly: true

worker:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-server-secret
          key: key
  volumes:
    - name: authentik-database-secret
      secret:
        secretName: authentik-database-secret
  volumeMounts:
    - name: authentik-database-secret
      mountPath: /authentik-database-secret
      readOnly: true

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-database-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
    username: authentik
    database: authentik
  primary:
    persistence:
      enabled: true
      storageClass: nfs
      accessModes:
        - ReadWriteOnce
      size: 5Gi