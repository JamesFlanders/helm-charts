# Artifact Hub: https://artifacthub.io/packages/helm/goauthentik/authentik

global:
  namespaceOverride: erinome

authentik:
  postgresql:
    user: file:///authentik-database-secret/username
    password: file:///authentik-database-secret/password

server:
  ingress:
    annotations:
      app.kubernetes.io/ingress.class: traefik
    enabled: true
    hosts:
      - idp.caenen.net
    tls:
      - hosts:
          - idp.caenen.net
        secretName: idp-caenen-net-tls
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-server-secret
          key: key
  volumes:
    - name: authentik-database-secret
      secret:
        secretName: authentik-database-secret
  volumeMounts:
    - name: authentik-database-secret
      mountPath: /authentik-database-secret
      readOnly: true

worker:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-server-secret
          key: key
  volumes:
    - name: authentik-database-secret
      secret:
        secretName: authentik-database-secret
  volumeMounts:
    - name: authentik-database-secret
      mountPath: /authentik-database-secret
      readOnly: true

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-database-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
    username: authentik
    database: authentik